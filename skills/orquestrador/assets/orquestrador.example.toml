# Exemplo: copie para config/orquestrador.toml no coordenador e personalize.
# Modelos abaixo reproduzem o piloto; disponibilidade deve ser validada.
[coordenador]
artefatos = "~/tmp/orquestrador"
max_executores = 2
max_revisores = 1
max_builds_pesados = 1
min_memoria_disponivel_gib = 4
retencao_dias = 14

# Autorização permanente: vale para qualquer harness coordenador.
# Mantenha só o que o usuário autorizou.
[autonomia]
modo_autonomo = true
# Transições derivadas de evento comprovado, sem pergunta:
# - "Ready for test": MR mesclada e o ambiente de teste roda a versão do merge.
# - "Waiting for deployment:testado": projeto com develop; a pessoa diz que testou.
# - "Done:main": projeto com develop; o commit da US chegou à main (release).
# - "Done:testado-main": projeto com branch_base = main; a pessoa diz que testou.
# - "Done:config": story com a tag config, MR mesclada e pipeline da branch base verde.
transicoes_automaticas = ["Ready for test", "Waiting for deployment:testado", "Done:main", "Done:testado-main", "Done:config"]
# Merge automático só quando a MR aponta para uma branch desta lista, com tudo isto
# conferido no head: revisão independente aprovada nesse SHA, pipeline verde nesse SHA,
# quality gate do Sonar OK (projeto que usa Sonar), sem Draft, sem discussão bloqueante
# aberta e sem conflito. Merge na main e em qualquer outra branch (staging) continua humano.
merge_automatico = ["develop"]
# Ações sem pergunta:
# - "limpeza": fechar panes, remover worktree, branches e pastas da US depois do merge.
# - "tirar-draft": revisão aprovada no head e CI verde.
# - "rebase-conflito": MR em conflito; o executor faz o rebase e o revisor confirma o delta.
# - "par-padrao": "despacha" sem executor/revisor usa implementacao-padrao e revisao-padrao.
acoes_automaticas = ["limpeza", "tirar-draft", "rebase-conflito", "par-padrao"]

[aliases.implementacao-padrao]
harness = "claude-code"
modelo = "claude-opus-5-5"
esforco = "medium"
ambiente = "local"

[aliases.revisao-padrao]
harness = "codex"
modelo = "gpt-6-sol"
esforco = "medium"
ambiente = "local"

[aliases.planejamento-padrao]
harness = "claude-code"
modelo = "claude-opus-5-5"
esforco = "medium"
ambiente = "local"

[[selecao]]
papel = "implementacao"
complexidade = "*"
risco = "*"
alias = "implementacao-padrao"
fallback = []

[[selecao]]
papel = "revisao"
complexidade = "*"
risco = "*"
alias = "revisao-padrao"
fallback = []

[[selecao]]
papel = "planejamento"
complexidade = "*"
risco = "*"
alias = "planejamento-padrao"
fallback = []

# Identidade GitLab por papel: o pane do worker recebe GLAB_CONFIG_DIR com este caminho.
# O token fica no config.yml desse diretório (chmod 600), nunca aqui. Papel sem entrada usa o glab do usuário.
[identidades.implementacao]
glab_config_dir = "/home/<usuario>/.config/glab-agentes/executor"

[identidades.revisao]
glab_config_dir = "/home/<usuario>/.config/glab-agentes/revisor"

[ambientes.local]
runtime = "herdr"
# Capacidades só passam para verificadas após o pré-voo.
permissoes_verificadas = false
qa_adversarial_modo = "nativo" # ou "arquivo", com autorização explícita

[projetos.exemplo]
caminho = "/caminho/absoluto/do/repositorio"
taiga_project_id = 0 # substituir pelo ID real
taiga_slug = "exemplo" # slug do board: --project da taiga-cli e projeto das US no orq
branch_base = "develop" # conferir no alvo; pode ser main
memoria_config = "/caminho/da/.ai-memory.toml"
fluxo = "basis-ci-gitlab" # adaptações ficam nas instruções do alvo

# Sobrescrita por projeto; a lista substitui a global.
# [projetos.exemplo.autonomia]
