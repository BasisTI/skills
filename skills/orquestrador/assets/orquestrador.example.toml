# Exemplo: copie para config/orquestrador.toml no coordenador e personalize.
# Modelos abaixo reproduzem o piloto; disponibilidade deve ser validada.
[coordenador]
artefatos = "~/tmp/orquestrador"
max_executores = 2
max_revisores = 1
max_builds_pesados = 1
min_memoria_disponivel_gib = 4
retencao_dias = 14

# Autorização permanente: vale para qualquer harness coordenador.
# Mantenha só o que o usuário autorizou.
[autonomia]
modo_autonomo = true
transicoes_automaticas = ["Ready for test", "Done:config"]

[aliases.implementacao-padrao]
harness = "claude-code"
modelo = "claude-opus-5-5"
esforco = "medium"
ambiente = "local"

[aliases.revisao-padrao]
harness = "codex"
modelo = "gpt-6-sol"
esforco = "medium"
ambiente = "local"

[aliases.planejamento-padrao]
harness = "claude-code"
modelo = "claude-opus-5-5"
esforco = "medium"
ambiente = "local"

[[selecao]]
papel = "implementacao"
complexidade = "*"
risco = "*"
alias = "implementacao-padrao"
fallback = []

[[selecao]]
papel = "revisao"
complexidade = "*"
risco = "*"
alias = "revisao-padrao"
fallback = []

[[selecao]]
papel = "planejamento"
complexidade = "*"
risco = "*"
alias = "planejamento-padrao"
fallback = []

# Identidade GitLab por papel: o pane do worker recebe GLAB_CONFIG_DIR com este caminho.
# O token fica no config.yml desse diretório (chmod 600), nunca aqui. Papel sem entrada usa o glab do usuário.
[identidades.implementacao]
glab_config_dir = "/home/<usuario>/.config/glab-agentes/executor"

[identidades.revisao]
glab_config_dir = "/home/<usuario>/.config/glab-agentes/revisor"

[ambientes.local]
runtime = "herdr"
# Capacidades só passam para verificadas após o pré-voo.
permissoes_verificadas = false
qa_adversarial_modo = "nativo" # ou "arquivo", com autorização explícita

[projetos.exemplo]
caminho = "/caminho/absoluto/do/repositorio"
taiga_project_id = 0 # substituir pelo ID real
branch_base = "develop" # conferir no alvo; pode ser main
memoria_config = "/caminho/da/.ai-memory.toml"
fluxo = "basis-ci-gitlab" # adaptações ficam nas instruções do alvo

